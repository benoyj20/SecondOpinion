<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="t d">
  <title id="t">How one claim is read and checked</title>
  <desc id="d">Reading: the report is cut into sentences, fixed rules type each claim, and a coverage gate turns any claim whose reading leaves words unused into UNMAPPED. With the optional AI helper on, the model can recover sentences the rules skipped and split half-read sentences; code checks every span and figure. Checking: claim types the rules handle (count, share, coverage, comparison, agreement, rank, ratio, statistic) are recounted with pandas, judged by tolerance rules, recounted eight ways and, for comparisons, given skeptic tests. UNMAPPED claims go to the AI plan path only when the helper is on: the model sees the sentence and the release schema, the plan is validated against whitelists, must use every stated word, and is run by pandas through lookup tables. Anything else, or any failure, is insufficient evidence with the reason. Every result then goes through the Claim Ladder.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#101a2f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1c2840"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .h { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
      .cn { font-size: 12.5px; font-weight: 700; fill: #f1f5f9; }
      .s { font-size: 11.5px; fill: #cbd5e1; }
      .m { font-size: 11px; fill: #8b9bb4; }
      .lbl { font-size: 10.5px; fill: #8b9bb4; }
      .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .chip { fill: #132036; stroke: #284063; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="720" rx="22" fill="url(#bg)"/>
  <rect width="960" height="720" rx="22" fill="url(#dots)" opacity="0.7"/>

  <text x="40" y="46" font-size="12" font-weight="700" letter-spacing="3" fill="#38bdf8">ONE CLAIM</text>
  <text x="40" y="76" font-size="23" font-weight="700" fill="#f8fafc">Rules own every claim they can read; AI only gets the rest</text>
  <text x="920" y="76" text-anchor="end" class="m">extract.py · audit.py · ai/</text>

  <!-- READ -->
  <rect x="40" y="100" width="880" height="112" rx="14" fill="#0f1b2e" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="60" y="124" class="eyebrow" fill="#7dd3fc">READ</text>
  <text x="104" y="124" class="lbl mono">POST /extract</text>

  <rect x="60" y="136" width="190" height="60" rx="10" class="chip"/>
  <text x="74" y="158" class="cn">Sentences</text>
  <text x="74" y="177" class="s">Markdown, text or PDF text</text>
  <text x="74" y="190" class="m">numbers written as words too</text>

  <line x1="252" y1="166" x2="266" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="136" width="190" height="60" rx="10" class="chip"/>
  <text x="284" y="158" class="cn">Type the claim</text>
  <text x="284" y="177" class="s">fixed rules, first match wins</text>
  <text x="284" y="190" class="m">same text, same result</text>

  <line x1="462" y1="166" x2="476" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="136" width="190" height="60" rx="10" class="chip"/>
  <text x="494" y="158" class="cn">Coverage gate</text>
  <text x="494" y="177" class="s">a word left unused?</text>
  <text x="494" y="190" class="m">then UNMAPPED, not a guess</text>

  <line x1="672" y1="166" x2="686" y2="166" stroke="#f0abfc" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="690" y="136" width="214" height="60" rx="10" fill="#1f1530" stroke="#f0abfc" stroke-opacity="0.45"/>
  <text x="704" y="158" class="cn">AI read <tspan class="m" font-weight="400">(optional)</tspan></text>
  <text x="704" y="177" class="s">recover skipped claims, split</text>
  <text x="704" y="190" class="m">spans copied, figures quoted</text>

  <!-- to the router -->
  <line x1="480" y1="214" x2="480" y2="236" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="492" y="230" class="lbl">claims; the reviewer can untick or add sentences</text>

  <!-- router -->
  <rect x="40" y="240" width="880" height="40" rx="10" fill="#131c31" stroke="#26334f"/>
  <text x="60" y="264" class="s"><tspan font-weight="700" fill="#f1f5f9">POST /audit</tspan> · the claim type picks the path · a multi-part sentence sends each part its own way and takes the worst part's verdict</text>

  <line x1="176" y1="282" x2="176" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="282" x2="480" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="784" y1="282" x2="784" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 1: rules -->
  <rect x="40" y="304" width="272" height="262" rx="14" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text x="56" y="328" class="eyebrow" fill="#5eead4">RULES</text>
  <text x="296" y="328" text-anchor="end" class="lbl">8 claim types</text>
  <text x="56" y="346" class="m mono" font-size="9.5">COUNT SHARE COVERAGE COMPARISON</text>
  <text x="56" y="358" class="m mono" font-size="9.5">AGREEMENT RANK RATIO STATISTIC</text>

  <rect x="54" y="368" width="244" height="44" rx="9" class="chip"/>
  <text x="68" y="386" class="cn">Check</text><text x="68" y="402" class="s">pandas on the release, a Fact</text>
  <rect x="54" y="416" width="244" height="44" rx="9" class="chip"/>
  <text x="68" y="434" class="cn">Judge</text><text x="68" y="450" class="s">tolerance rules in verdict.py</text>
  <rect x="54" y="464" width="244" height="44" rx="9" class="chip"/>
  <text x="68" y="482" class="cn">Recount 8 ways</text><text x="68" y="498" class="s">same verdict every time = robust</text>
  <rect x="54" y="512" width="244" height="44" rx="9" class="chip"/>
  <text x="68" y="530" class="cn">Skeptic</text><text x="68" y="546" class="s">comparisons: 200 shuffles, drop a site</text>

  <!-- lane 2: ai plan -->
  <rect x="344" y="304" width="272" height="262" rx="14" fill="#f0abfc" fill-opacity="0.05" stroke="#f0abfc" stroke-opacity="0.5"/>
  <text x="360" y="328" class="eyebrow" fill="#f5d0fe">AI PLAN</text>
  <text x="600" y="328" text-anchor="end" class="lbl">only when the helper is on</text>
  <text x="360" y="346" class="m">UNMAPPED claims; a rules verdict</text>
  <text x="360" y="358" class="m">is never overridden</text>

  <rect x="358" y="368" width="244" height="44" rx="9" class="chip"/>
  <text x="372" y="386" class="cn">Plan</text><text x="372" y="402" class="s">model sees sentence + schema only</text>
  <rect x="358" y="416" width="244" height="44" rx="9" class="chip"/>
  <text x="372" y="434" class="cn">Validate</text><text x="372" y="450" class="s">whitelisted fields; claim is in text</text>
  <rect x="358" y="464" width="244" height="44" rx="9" class="chip"/>
  <text x="372" y="482" class="cn">Coverage gate</text><text x="372" y="498" class="s">the plan uses every stated word</text>
  <rect x="358" y="512" width="244" height="44" rx="9" class="chip"/>
  <text x="372" y="530" class="cn">Run + judge</text><text x="372" y="546" class="s">lookup tables to pandas, never eval</text>

  <!-- ai fails → no verdict -->
  <line x1="604" y1="438" x2="644" y2="438" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a-amber)"/>
  <text x="624" y="430" text-anchor="middle" class="lbl" fill="#fcd34d">fails</text>

  <!-- lane 3: no verdict -->
  <rect x="648" y="304" width="272" height="262" rx="14" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="664" y="328" class="eyebrow" fill="#fcd34d">NO VERDICT</text>
  <text x="904" y="328" text-anchor="end" class="lbl mono">insufficient_evidence</text>
  <text x="664" y="346" class="m">always with the reason, and the data</text>
  <text x="664" y="358" class="m">that would be needed</text>

  <rect x="662" y="368" width="244" height="44" rx="9" class="chip"/>
  <text x="676" y="386" class="cn">Data can't answer</text><text x="676" y="402" class="s">treatment, cause, missing measures</text>
  <rect x="662" y="416" width="244" height="44" rx="9" class="chip"/>
  <text x="676" y="434" class="cn">No check yet</text><text x="676" y="450" class="s">UNMAPPED with the helper off</text>
  <rect x="662" y="464" width="244" height="44" rx="9" class="chip"/>
  <text x="676" y="482" class="cn">Only half read</text><text x="676" y="498" class="s">gate names the unused words</text>
  <rect x="662" y="512" width="244" height="44" rx="9" class="chip"/>
  <text x="676" y="530" class="cn">Check failed</text><text x="676" y="546" class="s">that claim only; the audit goes on</text>

  <!-- converge -->
  <line x1="176" y1="568" x2="176" y2="596" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="568" x2="480" y2="596" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="784" y1="568" x2="784" y2="596" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="600" width="880" height="66" rx="14" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.6"/>
  <text x="62" y="628" class="h">Claim Ladder</text>
  <text x="62" y="648" class="m">ladder.py · fixed rules</text>
  <text x="250" y="628" class="s" font-size="12.5"><tspan text-decoration="line-through" fill="#fca5a5">about 62%</tspan>  <tspan fill="#6ee7b7" font-weight="700">49.9% (421 of 844)</tspan></text>
  <text x="250" y="648" class="m">strike the over-strong words, write what the data supports, scope it to this release</text>

  <text x="40" y="694" class="lbl">Every result carries its evidence: the pandas code that ran, file checksums, the sample IDs and the eight recounts. The AI never states a number or sets a verdict.</text>
</svg>
