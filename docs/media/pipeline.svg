<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a SecondOpinion audit runs</title>
  <desc id="d">Five steps: read the report and pick out its claims; recount each figure from the TCGA-BRCA files; recount eight other reasonable ways to test whether the verdict is robust; strike what the data does not support and write what it does; a person accepts or overrides every verdict and exports audit.json.</desc>
  <style>
    .sans { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #10151f; } .soft { fill: #3f4959; } .faint { fill: #5a6474; }
    .title { font-size: 17px; font-weight: 600; }
    .desc { font-size: 13px; }

    /* One 10 s cycle; each step lights up for its 2 s slot. */
    .card { animation: card 10s infinite both; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: -8s; } .s3 { animation-delay: -6s; } .s4 { animation-delay: -4s; } .s5 { animation-delay: -2s; }
    @keyframes card { 0%, 19% { stroke: #9e2a5e; stroke-width: 2; } 21%, 100% { stroke: #d7dbe2; stroke-width: 1; } }
    .pulse { animation: pulse 10s linear infinite; }
    @keyframes pulse { from { transform: translateX(0); } to { transform: translateX(760px); } }

    .claimline { animation: claim 10s infinite; }
    @keyframes claim { 0% { opacity: 0; } 8%, 100% { opacity: 1; } }
    .count { animation: count 10s -8s infinite; }
    @keyframes count { 0% { opacity: 0; } 8%, 100% { opacity: 1; } }
    .dot { animation: dot 10s infinite; }
    @keyframes dot { 0% { opacity: 0; transform: scale(0.4); } 3%, 100% { opacity: 1; transform: scale(1); } }
    .strike { stroke-dasharray: 80; animation: strike 10s -4s infinite; }
    @keyframes strike { 0% { stroke-dashoffset: 80; } 6%, 100% { stroke-dashoffset: 0; } }
    .fix { animation: fix 10s -4s infinite; }
    @keyframes fix { 0%, 7% { opacity: 0; } 12%, 100% { opacity: 1; } }
    .press { animation: press 10s -2s infinite; }
    @keyframes press { 0% { fill: #ffffff; } 6%, 100% { fill: #9e2a5e; } }
    .presstext { animation: presstext 10s -2s infinite; }
    @keyframes presstext { 0% { fill: #7c1f49; } 6%, 100% { fill: #ffffff; } }
    .export { animation: fix 10s -2s infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { display: none; } }
  </style>

  <rect x="0.5" y="0.5" width="999" height="329" rx="16" fill="#faf5f7" stroke="#d7dbe2"/>
  <text x="33" y="44" class="sans ink" font-size="18" font-weight="600">How an audit runs</text>
  <text x="967" y="44" class="sans faint" font-size="13" text-anchor="end">A full report takes under 10 seconds</text>

  <!-- the track the steps sit on -->
  <line x1="120" y1="86" x2="880" y2="86" stroke="#d7dbe2" stroke-width="2"/>
  <circle class="pulse" cx="120" cy="86" r="5" fill="#9e2a5e" opacity="0.85"/>

  <!-- 1. Read -->
  <g transform="translate(33 0)">
    <rect class="card s1" x="0" y="108" width="174" height="196" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
    <circle cx="87" cy="86" r="14" fill="#9e2a5e"/><text x="87" y="91" class="sans" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">1</text>
    <text x="16" y="140" class="sans ink title">Read</text>
    <text class="sans soft desc"><tspan x="16" y="164">Picks every checkable</tspan><tspan x="16" y="182">claim out of a report:</tspan><tspan x="16" y="200">Markdown, text or PDF.</tspan></text>
    <rect x="16" y="224" width="142" height="6" rx="3" fill="#e6e8ec"/>
    <rect x="16" y="240" width="128" height="6" rx="3" fill="#e6e8ec"/>
    <g class="claimline"><rect x="12" y="234" width="146" height="18" rx="4" fill="#fbe8ef"/><rect x="16" y="240" width="128" height="6" rx="3" fill="#9e2a5e" opacity="0.55"/></g>
    <rect x="16" y="256" width="138" height="6" rx="3" fill="#e6e8ec"/>
    <rect x="16" y="272" width="92" height="6" rx="3" fill="#e6e8ec"/>
  </g>

  <!-- 2. Recount -->
  <g transform="translate(223 0)">
    <rect class="card s2" x="0" y="108" width="174" height="196" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
    <circle cx="87" cy="86" r="14" fill="#9e2a5e"/><text x="87" y="91" class="sans" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">2</text>
    <text x="16" y="140" class="sans ink title">Recount</text>
    <text class="sans soft desc"><tspan x="16" y="164">Counts each figure again</tspan><tspan x="16" y="182">from the TCGA-BRCA files</tspan><tspan x="16" y="200">with plain pandas code.</tspan></text>
    <text x="16" y="232" class="mono faint" font-size="11">sha256 39eb3be0…</text>
    <g class="count">
      <text x="16" y="262" class="mono ink" font-size="21" font-weight="600">421 / 844</text>
      <text x="16" y="286" class="mono" font-size="13" fill="#0b6b5e">= 49.9%</text>
    </g>
  </g>

  <!-- 3. Stress-test -->
  <g transform="translate(413 0)">
    <rect class="card s3" x="0" y="108" width="174" height="196" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
    <circle cx="87" cy="86" r="14" fill="#9e2a5e"/><text x="87" y="91" class="sans" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">3</text>
    <text x="16" y="140" class="sans ink title">Stress-test</text>
    <text class="sans soft desc"><tspan x="16" y="164">Recounts 8 reasonable</tspan><tspan x="16" y="182">ways. Does the verdict</tspan><tspan x="16" y="200">hold, or is it fragile?</tspan></text>
    <g fill="#b3261e">
      <circle class="dot" style="animation-delay:-6.00s; transform-origin:24px 244px" cx="24" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.85s; transform-origin:42px 244px" cx="42" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.70s; transform-origin:60px 244px" cx="60" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.55s; transform-origin:78px 244px" cx="78" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.40s; transform-origin:96px 244px" cx="96" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.25s; transform-origin:114px 244px" cx="114" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-5.10s; transform-origin:132px 244px" cx="132" cy="244" r="7"/>
      <circle class="dot" style="animation-delay:-4.95s; transform-origin:150px 244px" cx="150" cy="244" r="7"/>
    </g>
    <text x="16" y="280" class="sans soft" font-size="13">8 of 8 agree: <tspan font-weight="600" fill="#0b6b5e">robust</tspan></text>
  </g>

  <!-- 4. Rewrite -->
  <g transform="translate(603 0)">
    <rect class="card s4" x="0" y="108" width="174" height="196" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
    <circle cx="87" cy="86" r="14" fill="#9e2a5e"/><text x="87" y="91" class="sans" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">4</text>
    <text x="16" y="140" class="sans ink title">Rewrite</text>
    <text class="sans soft desc"><tspan x="16" y="164">Strikes what the data</tspan><tspan x="16" y="182">doesn't support and</tspan><tspan x="16" y="200">writes what it does.</tspan></text>
    <text x="16" y="242" class="serif ink" font-size="17" textLength="78" lengthAdjust="spacingAndGlyphs">about 62%</text>
    <line class="strike" x1="14" y1="236" x2="96" y2="236" stroke="#b3261e" stroke-width="2"/>
    <g class="fix">
      <text x="16" y="274" class="serif" font-size="15" font-weight="600" fill="#0b6b5e" textLength="140" lengthAdjust="spacingAndGlyphs">49.9% (421 of 844)</text>
      <line x1="16" y1="280" x2="156" y2="280" stroke="#0b6b5e" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 5. Sign off -->
  <g transform="translate(793 0)">
    <rect class="card s5" x="0" y="108" width="174" height="196" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
    <circle cx="87" cy="86" r="14" fill="#9e2a5e"/><text x="87" y="91" class="sans" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">5</text>
    <text x="16" y="140" class="sans ink title">Sign off</text>
    <text class="sans soft desc"><tspan x="16" y="164">A person accepts or</tspan><tspan x="16" y="182">overrides each verdict,</tspan><tspan x="16" y="200">then exports the audit.</tspan></text>
    <rect class="press" x="16" y="222" width="66" height="28" rx="6" fill="#9e2a5e" stroke="#9e2a5e"/>
    <text class="sans presstext" x="49" y="240" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Accept</text>
    <rect x="90" y="222" width="68" height="28" rx="6" fill="#ffffff" stroke="#aeb5c1"/>
    <text class="sans ink" x="124" y="240" font-size="12.5" text-anchor="middle">Override</text>
    <g class="export">
      <path d="M17 264 h10 l5 5 v14 h-15 z" fill="none" stroke="#3f4959" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="40" y="280" class="mono ink" font-size="13">audit.json</text>
    </g>
  </g>
</svg>
