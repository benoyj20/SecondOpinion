<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="t d">
  <title id="t">SecondOpinion architecture</title>
  <desc id="d">A reviewer uses the Next.js web app, which proxies /api to a stateless FastAPI service; the second-opinion CLI calls the same engine directly. The Python audit engine runs seven stages on each claim: read, coverage gate, check with pandas, judge with tolerance rules, recount eight ways, skeptic tests and the Claim Ladder. It reads the TCGA-BRCA release folder (checksummed, read-only, no database) and the bundled challenge repository. An optional OpenAI-compatible model sees report text and the release schema only, never data values. Every claim ends supported, contradicted or insufficient evidence; a person reviews each one, chooses a decision and exports audit.json and a Decision Record.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#101a2f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1c2840"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
    <marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0abfc"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .h { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
      .s { font-size: 12px; fill: #cbd5e1; }
      .m { font-size: 11.5px; fill: #8b9bb4; }
      .lbl { font-size: 10.5px; fill: #8b9bb4; }
      .card { fill: #131c31; stroke: #26334f; stroke-width: 1; }
      .chip { fill: #132036; stroke: #284063; stroke-width: 1; }
      .cn { font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .num { font-size: 11px; font-weight: 800; fill: #0b1120; }
    </style>
  </defs>

  <!-- background -->
  <rect width="960" height="860" rx="22" fill="url(#bg)"/>
  <rect width="960" height="860" rx="22" fill="url(#dots)" opacity="0.7"/>
  <circle cx="820" cy="320" r="190" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="120" cy="720" r="160" fill="#38bdf8" opacity="0.04"/>

  <!-- header -->
  <text x="40" y="46" font-size="12" font-weight="700" letter-spacing="3" fill="#2dd4bf">ARCHITECTURE</text>
  <text x="40" y="76" font-size="23" font-weight="700" fill="#f8fafc">One report, from upload to a signed-off audit</text>
  <text x="920" y="76" text-anchor="end" class="m">no database · code sets every verdict</text>

  <!-- row 1: reviewer → web → api ; cli -->
  <g>
    <rect x="40" y="104" width="170" height="84" rx="12" class="card"/>
    <rect x="40" y="104" width="4" height="84" rx="2" fill="#94a3b8"/>
    <circle cx="70" cy="146" r="15" fill="#1e293b" stroke="#94a3b8"/>
    <circle cx="70" cy="141" r="4.5" fill="#cbd5e1"/>
    <path d="M61,154 a9,7 0 0 1 18,0" fill="#cbd5e1"/>
    <text x="96" y="136" class="h">Reviewer</text>
    <text x="96" y="157" class="s">report + release</text>
    <text x="96" y="174" class="m">.md · .txt · .pdf</text>
  </g>

  <line x1="212" y1="146" x2="266" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>

  <g>
    <rect x="270" y="104" width="250" height="84" rx="12" class="card"/>
    <rect x="270" y="104" width="4" height="84" rx="2" fill="#38bdf8"/>
    <text x="292" y="136" class="h">Web app</text>
    <text x="360" y="136" class="mono" font-size="13" fill="#38bdf8">:3000</text>
    <text x="292" y="157" class="s">Next.js 16 · React 19 · Tailwind 4</text>
    <text x="292" y="174" class="m">audit kept in the tab (sessionStorage)</text>
  </g>

  <line x1="522" y1="146" x2="576" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <text x="549" y="138" text-anchor="middle" class="lbl mono">/api/*</text>

  <g>
    <rect x="580" y="104" width="210" height="84" rx="12" class="card"/>
    <rect x="580" y="104" width="4" height="84" rx="2" fill="#a78bfa"/>
    <text x="602" y="136" class="h">API</text>
    <text x="636" y="136" class="mono" font-size="13" fill="#a78bfa">:8000</text>
    <rect x="696" y="120" width="80" height="18" rx="9" fill="#a78bfa" opacity="0.16"/>
    <text x="736" y="133" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#c4b5fd">STATELESS</text>
    <text x="602" y="157" class="s">FastAPI · Pydantic</text>
    <text x="602" y="174" class="m">14 routes · browser sends state</text>
  </g>

  <g>
    <rect x="810" y="104" width="110" height="84" rx="12" class="card"/>
    <rect x="810" y="104" width="4" height="84" rx="2" fill="#a78bfa"/>
    <text x="830" y="136" class="h">CLI</text>
    <text x="830" y="157" class="s">same engine</text>
    <text x="830" y="174" class="m mono" font-size="9.5">second-opinion</text>
  </g>

  <!-- data boundary: engine + local data; the LLM sits outside -->
  <path d="M24,226 H936 V420 H580 V556 H24 Z" fill="#2dd4bf" fill-opacity="0.025" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="6 6" stroke-linejoin="round"/>
  <rect x="36" y="218" width="160" height="17" rx="4" fill="#0d1527"/>
  <text x="44" y="230.5" font-size="10" font-weight="700" letter-spacing="2" fill="#5eead4">DATA NEVER LEAVES</text>

  <!-- api → engine, cli → engine -->
  <line x1="685" y1="190" x2="685" y2="244" stroke="#a78bfa" stroke-width="2" marker-end="url(#a-violet)"/>
  <text x="695" y="211" class="lbl" fill="#c4b5fd">claims + release path</text>
  <line x1="865" y1="190" x2="865" y2="244" stroke="#a78bfa" stroke-width="2" marker-end="url(#a-violet)"/>

  <!-- engine -->
  <rect x="40" y="248" width="880" height="150" rx="14" fill="#0f1b2e" stroke="#1f5552" stroke-width="1.2"/>
  <text x="60" y="277" class="h">Audit engine</text>
  <text x="160" y="277" class="mono" font-size="13" fill="#2dd4bf">second_opinion/</text>
  <text x="290" y="277" class="m">Python · pandas</text>
  <text x="900" y="277" text-anchor="end" class="m">7 stages per claim · one package for API and CLI</text>

  <line x1="80" y1="338" x2="880" y2="338" stroke="url(#flow)" stroke-width="2.5" opacity="0.9"/>

  <!-- chips: x = 58 + i*122, w = 112 -->
  <g>
    <rect x="58" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="76" cy="314" r="10" fill="#38bdf8"/><text x="76" y="318" text-anchor="middle" class="num">1</text>
    <text x="92" y="319" class="cn">Read</text>
    <text x="72" y="348" class="s">sentences, claims</text>
    <text x="72" y="365" class="m">number words</text>
  </g>
  <g>
    <rect x="180" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="198" cy="314" r="10" fill="#38bdf8"/><text x="198" y="318" text-anchor="middle" class="num">2</text>
    <text x="214" y="319" class="cn">Gate</text>
    <text x="194" y="348" class="s">every word used?</text>
    <text x="194" y="365" class="m">else can't check</text>
  </g>
  <g>
    <rect x="302" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="320" cy="314" r="10" fill="#22d3ee"/><text x="320" y="318" text-anchor="middle" class="num">3</text>
    <text x="336" y="319" class="cn">Check</text>
    <text x="316" y="348" class="s">pandas recount</text>
    <text x="316" y="365" class="m">8 claim types</text>
  </g>
  <g>
    <rect x="424" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="442" cy="314" r="10" fill="#2dd4bf"/><text x="442" y="318" text-anchor="middle" class="num">4</text>
    <text x="458" y="319" class="cn">Judge</text>
    <text x="438" y="348" class="s">tolerance rules</text>
    <text x="438" y="365" class="m">±2 points · ±2%</text>
  </g>
  <g>
    <rect x="546" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="564" cy="314" r="10" fill="#2dd4bf"/><text x="564" y="318" text-anchor="middle" class="num">5</text>
    <text x="580" y="319" class="cn">Recount</text>
    <text x="560" y="348" class="s">8 ways to count</text>
    <text x="560" y="365" class="m">robust / fragile</text>
  </g>
  <g>
    <rect x="668" y="294" width="112" height="88" rx="10" class="chip"/>
    <circle cx="686" cy="314" r="10" fill="#a3e635"/><text x="686" y="318" text-anchor="middle" class="num">6</text>
    <text x="702" y="319" class="cn">Skeptic</text>
    <text x="682" y="348" class="s">label shuffle</text>
    <text x="682" y="365" class="m">leave a site out</text>
  </g>
  <g>
    <rect x="790" y="294" width="112" height="88" rx="10" fill="#fbbf24" opacity="0.18" filter="url(#glow)"/>
    <rect x="790" y="294" width="112" height="88" rx="10" fill="#1a2236" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="808" cy="314" r="10" fill="#fbbf24"/><text x="808" y="318" text-anchor="middle" class="num">7</text>
    <text x="824" y="319" class="cn">Ladder</text>
    <text x="804" y="348" class="s">strike + rewrite</text>
    <text x="804" y="365" class="m">fixed rules</text>
  </g>

  <!-- engine ↔ release, engine ↔ challenge -->
  <line x1="236" y1="384" x2="236" y2="438" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-teal)"/>
  <text x="246" y="416" class="lbl" fill="#99f6e4">reads, never writes</text>
  <line x1="480" y1="384" x2="480" y2="438" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-teal)"/>
  <text x="490" y="416" class="lbl" fill="#99f6e4">unseal · fetch</text>

  <!-- release -->
  <g>
    <rect x="40" y="442" width="300" height="94" rx="12" class="card"/>
    <rect x="40" y="442" width="4" height="94" rx="2" fill="#5eead4"/>
    <text x="62" y="471" class="h">TCGA-BRCA release</text>
    <text x="62" y="493" class="s">5 files + optional RNA · SHA-256</text>
    <text x="62" y="511" class="m">release A or an envelope's release/</text>
    <text x="62" y="527" class="m">a plain folder; no database</text>
  </g>

  <!-- challenge repo -->
  <g>
    <rect x="356" y="442" width="204" height="94" rx="12" class="card"/>
    <rect x="356" y="442" width="4" height="94" rx="2" fill="#5eead4"/>
    <text x="378" y="471" class="h">Challenge repo</text>
    <text x="378" y="493" class="s mono" font-size="11">oncosys-hackathon-</text>
    <text x="378" y="508" class="s mono" font-size="11">challenge/ (bundled)</text>
    <text x="378" y="527" class="m">fetch.py · unseal.py · schema</text>
  </g>

  <!-- engine ↔ llm -->
  <line x1="786" y1="384" x2="786" y2="438" stroke="#f0abfc" stroke-width="1.6" stroke-dasharray="4 4" marker-start="url(#a-pink)" marker-end="url(#a-pink)"/>
  <text x="776" y="416" text-anchor="end" class="lbl" fill="#f5d0fe">text + schema only</text>

  <!-- llm -->
  <g>
    <rect x="620" y="442" width="300" height="94" rx="12" class="card"/>
    <rect x="620" y="442" width="4" height="94" rx="2" fill="#f0abfc"/>
    <text x="642" y="471" class="h">AI helper</text>
    <rect x="788" y="457" width="118" height="18" rx="9" fill="#f0abfc" opacity="0.14"/>
    <text x="847" y="470" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#f5d0fe">OPTIONAL · EXTERNAL</text>
    <text x="642" y="493" class="s">split · find missed claims · plan</text>
    <text x="642" y="511" class="m">Review wording with {blanks} for numbers</text>
    <text x="642" y="527" class="m">any OpenAI-compatible endpoint · off by default</text>
  </g>

  <!-- engine → verdicts -->
  <line x1="600" y1="400" x2="600" y2="586" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="586" x2="780" y2="586" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="586" x2="180" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <line x1="480" y1="586" x2="480" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <line x1="780" y1="586" x2="780" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <text x="330" y="577" text-anchor="middle" class="lbl">each claim with its evidence: code, checksums, sample IDs, 8 recounts</text>

  <!-- verdicts -->
  <g>
    <rect x="40" y="604" width="280" height="86" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="60" y="633" class="mono" font-size="13" font-weight="700" fill="#6ee7b7">supported</text>
    <text x="300" y="633" text-anchor="end" font-size="10.5" font-weight="700" fill="#34d399">MATCHES</text>
    <text x="60" y="656" class="s">equal at the report's precision</text>
    <text x="60" y="674" class="m">or within "about" tolerance</text>
  </g>
  <g>
    <rect x="340" y="604" width="280" height="86" rx="12" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="360" y="633" class="mono" font-size="13" font-weight="700" fill="#fca5a5">contradicted</text>
    <text x="600" y="633" text-anchor="end" font-size="10.5" font-weight="700" fill="#f87171">WRONG</text>
    <text x="360" y="656" class="s">correct value with its denominator</text>
    <text x="360" y="674" class="m">Claim Ladder writes the fix</text>
  </g>
  <g>
    <rect x="640" y="604" width="280" height="86" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="660" y="633" class="mono" font-size="13" font-weight="700" fill="#fcd34d">insufficient_evidence</text>
    <text x="900" y="633" text-anchor="end" font-size="10.5" font-weight="700" fill="#fbbf24">CAN'T TELL</text>
    <text x="660" y="656" class="s">data can't answer, or no check yet</text>
    <text x="660" y="674" class="m">names the data that would be needed</text>
  </g>

  <!-- person: review → decision → export -->
  <line x1="480" y1="692" x2="480" y2="716" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <text x="492" y="708" class="lbl">a person checks every one</text>

  <rect x="40" y="720" width="880" height="80" rx="14" fill="#131c31" stroke="#26334f"/>
  <g>
    <text x="62" y="750" class="cn">Review</text>
    <text x="62" y="770" class="s">accept or override, with a reason</text>
    <text x="62" y="786" class="m">4 role views from roles.yaml</text>
  </g>
  <line x1="300" y1="758" x2="340" y2="758" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <g>
    <text x="352" y="750" class="cn">Decision</text>
    <text x="352" y="770" class="s">Proceed · Fix · Narrow · Stop</text>
    <text x="352" y="786" class="m">suggested by rule; a person chooses</text>
  </g>
  <line x1="590" y1="758" x2="630" y2="758" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-slate)"/>
  <g>
    <text x="642" y="750" class="cn">Export</text>
    <text x="642" y="770" class="s mono" font-size="11.5">audit.json + decision_record.md</text>
    <text x="642" y="786" class="m">locked until every claim is reviewed</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="830" x2="64" y2="830" stroke="#94a3b8" stroke-width="2"/>
  <text x="72" y="834" class="lbl">request path</text>
  <line x1="160" y1="830" x2="184" y2="830" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="192" y="834" class="lbl">lookup</text>
  <rect x="250" y="823" width="22" height="14" rx="3" fill="none" stroke="#2dd4bf" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <text x="280" y="834" class="lbl">release data stays inside; the model never sees a data value</text>
  <text x="920" y="834" text-anchor="end" class="lbl">npm run dev = web + API, local processes</text>
</svg>
